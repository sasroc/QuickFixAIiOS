name: QuickFixAIiOS
options:
  bundleIdPrefix: com.quickfixai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  QuickFixAIiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuickFixAIiOS
    info:
      path: QuickFixAIiOS/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        CFBundleURLTypes:
          - CFBundleURLName: "Google Sign-In"
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.221670947558-5tro16fhp34hsf4gtc1pd9kro5ud61ev"
          - CFBundleURLName: "QuickFix AI Deep Links"
            CFBundleURLSchemes:
              - "quickfixai"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: "QuickFix AI"
        NSCameraUsageDescription: "Take a photo of your repair issue so our AI can better diagnose the problem."
        NSPhotoLibraryUsageDescription: "Choose a photo of your repair issue for AI analysis."
        NSMicrophoneUsageDescription: "Describe your repair issue using your voice."
        NSPhotoLibraryAddUsageDescription: "Save repair guide images to your library."
        NSSpeechRecognitionUsageDescription: "Convert your spoken description to text for AI repair analysis."
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
      - package: GoogleSignIn-iOS
        product: GoogleSignInSwift
    entitlements:
      path: QuickFixAIiOS/QuickFixAIiOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickfixai.ios
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  QuickFixAIiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuickFixAIiOSTests
    dependencies:
      - target: QuickFixAIiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickfixai.ios.tests
